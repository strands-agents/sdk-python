name: "Changelog: Sync"

on:
  release:
    types: [published]
  schedule:
    - cron: '17 7 * * *'   # daily backstop for missed release events
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Backfill all releases'
        type: boolean
        default: false
      tag:
        description: 'Single release tag to sync (ignored when backfill is checked)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  sync:
    # On release: only our in-scope tag prefixes. The bare `v` prefix is for
    # pre-monorepo python releases; the action itself rejects any tag that
    # isn't `v<digit>`, so a stray non-version `v…` tag produces a no-op run.
    # Cron/dispatch: always run.
    if: >
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'python/v') ||
      startsWith(github.event.release.tag_name, 'typescript/v') ||
      startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Sync harness releases
        uses: strands-agents/devtools/changelog-release-pr@main
        with:
          source-repo: strands-agents/harness-sdk
          mode: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.backfill)) && 'backfill' || 'single' }}
          # Cron is a cheap backstop: only generate missing files (no
          # re-enrichment API cost, never regresses existing files). An explicit
          # dispatch backfill is a full refresh.
          skip-existing: ${{ github.event_name == 'schedule' }}
          tag: ${{ github.event.release.tag_name || inputs.tag }}
          github-token: ${{ github.token }}

      # Evals backstop: evals' own release workflow opens the cross-repo PR for
      # instant sync, but this catches missed events with plain github.token —
      # evals is public (reads need no auth) and the PR targets this repo.
      - name: Sync missed evals releases
        if: github.event_name == 'schedule'
        uses: strands-agents/devtools/changelog-release-pr@main
        with:
          source-repo: strands-agents/evals
          mode: backfill
          skip-existing: 'true'
          github-token: ${{ github.token }}
