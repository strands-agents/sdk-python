name: Auto Bug Verify

# Runs the agent-based bug verifier when a bug issue is opened. The verifier
# inspects the implicated code, runs a reproduction in a sandbox, scores
# urgency, and applies triage labels. It comments on the issue in two cases:
# (1) when the reporter's bug could not be validated as written but the agent
# produced its own working reproduction (to share that repro), and (2) when
# the agent could not reproduce the bug at all and needs more info from the
# reporter.
#
# Trigger: issue creation, filtered to bug reports by the `[BUG]` title prefix
# that the bug_report.yml template pre-fills. (The `bug` label can't be the
# trigger: it is applied by the issue-labeler bot, and there is no reliable
# point to gate on.)
#
# This runs ungated: any opened `[BUG]` issue dispatches the verifier, matching
# the existing issue-responder.yml pattern of reacting to issue creation. The
# agent runs in the strands-command read-only sandbox and its only writes are
# triage labels plus the single conditional comment described above.
#
# Maintainers can also run it manually by commenting `/strands bug-verify`.

on:
  issues:
    types: [opened]

jobs:
  trigger-bug-verify:
    # Only bug reports: the bug_report.yml template pre-fills "[BUG] " as the title.
    if: startsWith(github.event.issue.title, '[BUG]')
    name: Trigger Bug Verify
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Strands Command Workflow
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'strands-command.yml',
              ref: 'main',
              inputs: {
                issue_id: String(context.payload.issue.number),
                command: 'bug-verify',
                session_id: ''
              }
            });
            console.log(`Triggered /strands bug-verify for issue #${context.payload.issue.number}`);
