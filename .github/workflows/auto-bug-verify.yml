name: Auto Bug Verify

# Runs the agent-based bug verifier when a bug issue is opened. The verifier
# inspects the implicated code, runs a reproduction in a sandbox, scores
# urgency, and applies triage labels. It comments on the issue in two cases:
# (1) when the reporter's bug could not be validated as written but the agent
# produced its own working reproduction (to share that repro), and (2) when
# the agent could not reproduce the bug at all and needs more info from the
# reporter.
#
# Trigger: issue creation, filtered to bug reports by the `[BUG]` title prefix
# that the bug_report.yml template pre-fills. (The `bug` label can't be the
# trigger: it is applied by the issue-labeler bot, and there is no reliable
# point to gate on.)
#
# This runs ungated: any opened `[BUG]` issue dispatches the verifier, matching
# the existing issue-responder.yml pattern of reacting to issue creation. The
# agent runs in the strands-command read-only sandbox and its only writes are
# triage labels plus a single conditional comment as described above.
#
# DEPENDENCY: requires strands-agents/devtools#71 (which ships the
# task-bug-verifier SOP and registers the `bug-verify` command) to be merged
# first. Without it, the strands-command parser silently falls through to
# `refiner` mode and the agent would produce confused refiner output on every
# bug report. The "Verify devtools dependency" step below guards against this
# by skipping the dispatch (with a logged warning) until the SOP is present on
# strands-agents/devtools@main.
#
# Maintainers can also run it manually by commenting `/strands bug-verify`.

on:
  issues:
    types: [opened]

jobs:
  trigger-bug-verify:
    # Only bug reports: the bug_report.yml template pre-fills "[BUG] " as the title.
    if: startsWith(github.event.issue.title, '[BUG]')
    name: Trigger Bug Verify
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Verify devtools dependency
        id: devtools-check
        run: |
          set -euo pipefail
          SOP_URL="https://raw.githubusercontent.com/strands-agents/devtools/main/strands-command/agent-sops/task-bug-verifier.sop.md"
          # -f: fail (non-zero exit) on HTTP error. -s: silent. -o /dev/null: discard body. -I: HEAD only.
          if curl -fsI -o /dev/null "$SOP_URL"; then
            echo "sop_present=true" >> "$GITHUB_OUTPUT"
            echo "✅ devtools task-bug-verifier SOP found on main"
          else
            echo "sop_present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping bug-verify dispatch: devtools task-bug-verifier SOP not yet on strands-agents/devtools@main. This guard prevents the strands-command parser from silently falling through to refiner mode. Merge strands-agents/devtools#71 first."
          fi
      - name: Trigger Strands Command Workflow
        if: steps.devtools-check.outputs.sop_present == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'strands-command.yml',
              ref: 'main',
              inputs: {
                issue_id: String(context.payload.issue.number),
                command: 'bug-verify',
                session_id: ''
              }
            });
            console.log(`Triggered /strands bug-verify for issue #${context.payload.issue.number}`);
