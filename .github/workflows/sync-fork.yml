name: Sync fork with upstream

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-updated]

permissions:
  contents: write

concurrency:
  group: sync-fork-with-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: strands-agents/harness-sdk
  UPSTREAM_BRANCH: main
  MIRROR_BRANCH: upstream-main
  PACKAGE_BRANCH: npm-background-tasks
  PACKAGE_PREFIX: strands-ts
  PACKAGE_PATCH_COUNT: 2

jobs:
  sync:
    name: Sync fork and Background Tasks package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Rebase fork branches
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${MIRROR_BRANCH}:refs/remotes/origin/${MIRROR_BRANCH}" \
            "+refs/heads/${PACKAGE_BRANCH}:refs/remotes/origin/${PACKAGE_BRANCH}"
          git fetch --no-tags upstream \
            "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"

          current_main="$(git rev-parse origin/main)"
          current_mirror="$(git rev-parse "origin/${MIRROR_BRANCH}")"
          current_package="$(git rev-parse "origin/${PACKAGE_BRANCH}")"
          upstream_tip="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"

          main_parent="$(git rev-parse "${current_main}^")"
          if [[ "${main_parent}" != "${current_mirror}" ]]; then
            echo "main must contain exactly one automation commit on top of ${MIRROR_BRANCH}." >&2
            exit 1
          fi

          current_package_base="$(git rev-parse "${current_package}~${PACKAGE_PATCH_COUNT}")"
          current_package_base_tree="$(git rev-parse "${current_package_base}^{tree}")"
          current_mirror_package_tree="$(git rev-parse "${current_mirror}:${PACKAGE_PREFIX}")"
          if [[ "${current_package_base_tree}" != "${current_mirror_package_tree}" ]]; then
            echo "${PACKAGE_BRANCH} must contain exactly ${PACKAGE_PATCH_COUNT} commits on the current ${PACKAGE_PREFIX} tree." >&2
            exit 1
          fi

          automation_files="$(git diff-tree --no-commit-id --name-only -r "${current_main}")"
          if [[ "${automation_files}" != ".github/workflows/sync-fork.yml" ]]; then
            echo "The automation commit may only change .github/workflows/sync-fork.yml." >&2
            exit 1
          fi

          install_hook_files="$(git diff-tree --no-commit-id --name-only -r "${current_package}")"
          if [[ "${install_hook_files}" != "package.json" ]]; then
            echo "The package install-hook commit may only change package.json." >&2
            exit 1
          fi

          if git grep --quiet --ignore-case --extended-regexp 'dispatch[_ -]?agent|dispatchAgent' "${current_package}" -- .; then
            echo "${PACKAGE_BRANCH} must not contain dispatch_agent." >&2
            exit 1
          fi

          if [[ "${current_mirror}" == "${upstream_tip}" ]]; then
            echo "Fork and package branches already contain upstream ${upstream_tip}."
            exit 0
          fi

          temp_dir="$(mktemp -d)"
          validation_dir="${temp_dir}/validation"
          trap 'git worktree remove --force "${validation_dir}" >/dev/null 2>&1 || true; rm -rf "${temp_dir}"' EXIT
          automation_patch="${temp_dir}/automation.patch"
          feature_patch="${temp_dir}/background-tasks.patch"
          install_hook_patch="${temp_dir}/install-hook.patch"
          git format-patch --stdout -1 "${current_main}" > "${automation_patch}"
          git format-patch --stdout -1 "${current_package}^" > "${feature_patch}"
          git format-patch --stdout -1 "${current_package}" > "${install_hook_patch}"

          git worktree add --detach "${validation_dir}" "${upstream_tip}"
          git -C "${validation_dir}" apply --3way --directory="${PACKAGE_PREFIX}" "${feature_patch}"
          expected_diff="$(git -C "${validation_dir}" diff HEAD --binary | git hash-object --stdin)"
          (
            cd "${validation_dir}"
            npm ci --ignore-scripts
            npm run build -w "${PACKAGE_PREFIX}"
            npm run check -w "${PACKAGE_PREFIX}"
          )
          actual_diff="$(git -C "${validation_dir}" diff HEAD --binary | git hash-object --stdin)"
          if [[ "${actual_diff}" != "${expected_diff}" ]]; then
            echo "Package checks modified the Background Tasks patch." >&2
            exit 1
          fi

          git switch --detach "${upstream_tip}"
          git am -3 "${automation_patch}"
          next_main="$(git rev-parse HEAD)"

          next_package_base="$(git subtree split --quiet --prefix="${PACKAGE_PREFIX}" "${upstream_tip}")"
          if [[ "${next_package_base}" == "${current_package_base}" ]]; then
            next_package="${current_package}"
          else
            git switch --detach "${next_package_base}"
            git am -3 "${feature_patch}" "${install_hook_patch}"
            next_package="$(git rev-parse HEAD)"

            npm install --ignore-scripts --no-package-lock
            npm run build
            git diff --exit-code
          fi

          if git grep --quiet --ignore-case --extended-regexp 'dispatch[_ -]?agent|dispatchAgent' "${next_package}" -- .; then
            echo "Refusing to publish ${PACKAGE_BRANCH} with dispatch_agent." >&2
            exit 1
          fi

          git push --atomic origin \
            "--force-with-lease=refs/heads/main:${current_main}" \
            "--force-with-lease=refs/heads/${MIRROR_BRANCH}:${current_mirror}" \
            "--force-with-lease=refs/heads/${PACKAGE_BRANCH}:${current_package}" \
            "${next_main}:refs/heads/main" \
            "${upstream_tip}:refs/heads/${MIRROR_BRANCH}" \
            "${next_package}:refs/heads/${PACKAGE_BRANCH}"
