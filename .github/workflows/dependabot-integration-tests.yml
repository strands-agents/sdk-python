name: Dependabot Integration Tests

on:
  workflow_call:
    inputs:
      ecosystem:
        required: true
        type: string
      pr_number:
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  python:
    # Same-repo head guard: dependabot PRs always originate from same-repo
    # branches. Refusing fork heads prevents untrusted code from running with
    # the privileged integration-test role under pull_request_target.
    if: inputs.ecosystem == 'python' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strands-py
    steps:
      - name: Configure Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.STRANDS_INTEG_TEST_ROLE }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Checkout head commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install --no-cache-dir hatch 'virtualenv<21'
      - name: Run integration tests
        env:
          AWS_REGION: us-east-1
          AWS_REGION_NAME: us-east-1
          STRANDS_TEST_API_KEYS_SECRET_NAME: ${{ secrets.STRANDS_TEST_API_KEYS_SECRET_NAME }}
        run: hatch test tests_integ

  typescript:
    # Same-repo head guard (see python job).
    if: inputs.ecosystem == 'typescript' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Configure Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Checkout head commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: |
          npm ci
          npm run test:browser:install
      - name: Build the package
        run: npm run build
      - name: Run integration tests
        run: npm run test:integ:all
