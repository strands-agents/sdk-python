name: "Catalog: Editorial Review Flag"

# No paths filter: a push that removes every catalog change must still run so
# the stale label/comment from an earlier push gets cleared. The script
# early-exits cheaply when the PR touches no catalog files.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

# pull_request_target runs in the base-repo context so the job can label and
# comment on fork PRs. It never checks out or executes PR head code — the
# diff is read via the REST API only.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  flag-editorial-fields:
    name: Flag editorial catalog fields
    runs-on: ubuntu-latest
    steps:
      - name: Flag featured/badges set by non-maintainers
        uses: actions/github-script@v9
        env:
          EDITORIAL_LABEL: 'catalog: editorial-review'
          # Roles that may grant featured/badges. Matches the collaborator
          # permission model used by bot-pr-review-gate.yml.
          MAINTAINER_ROLES: 'write,maintain,admin'
        with:
          script: |
            // `featured` and `badges` on catalog entries are granted by the
            // Strands team. When a PR from someone without write access adds,
            // changes, or removes them, this job applies a label and a sticky
            // comment so reviewers notice — it never fails, so it is an
            // indicator, not a merge gate.

            const pr = context.payload.pull_request;
            const label = process.env.EDITORIAL_LABEL;
            const marker = '<!-- catalog-editorial-review -->';
            const maintainerRoles = process.env.MAINTAINER_ROLES
              .split(',').map(r => r.trim()).filter(Boolean);

            async function findStickyComment() {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
              });
              return comments.find(c => c.body && c.body.includes(marker));
            }

            // A previous push may have flagged this PR; clear the stale
            // label and comment so reviewers aren't misled.
            async function clearStaleFlag() {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              const stale = await findStickyComment();
              if (stale) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: stale.id,
                  body: [
                    marker,
                    '### Editorial catalog fields detected',
                    '',
                    '~~Resolved~~ — a later push removed the `featured`/`badges` changes, so this no longer applies.',
                  ].join('\n'),
                });
              }
            }

            // --- Does the diff touch editorial fields? --------------------
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const catalogFiles = files.filter(f => f.filename.startsWith('site/src/content/catalog/'));
            if (catalogFiles.length === 0) {
              console.log('PR touches no catalog files — clearing any stale flag.');
              await clearStaleFlag();
              return;
            }

            // Both directions are editorial: adding a grant a submitter isn't
            // entitled to, and removing one that a maintainer made. A change
            // like `featured: true` → `featured: false` appears in the diff
            // as a removal plus an addition, so the removal patterns cover it.
            //
            // YAML 1.2 (Astro's content loader) parses yes/on as strings, which
            // the schema's z.boolean() rejects at the build gate — only the
            // true spellings can reach main.
            const addedFeaturedRe = /^\+\s*featured:\s*(true|True|TRUE)\b/;
            const removedFeaturedRe = /^-\s*featured:\s*(true|True|TRUE)\b/;
            // Inline non-empty value: `badges: [x]` or `badges: verified` —
            // but not an explicitly empty `badges: []`.
            const addedBadgesInlineRe = /^\+\s*badges:\s*(?!\[\s*\]\s*(#.*)?$)\S/;
            const removedBadgesInlineRe = /^-\s*badges:\s*(?!\[\s*\]\s*(#.*)?$)\S/;
            const addedBadgesBlockRe = /^\+\s*badges:\s*(#.*)?$/;
            // `verified` is the only badge value the schema accepts, so match
            // it exactly rather than any added list item in the rest of the
            // patch (which could belong to a different block-style field).
            const addedListItemRe = /^\+\s*-\s*['"]?verified['"]?\s*$/;
            // A removed `- verified` list item can only be a badge, so match
            // it directly without requiring a `badges:` line in the diff (the
            // header often survives as context when only items are removed).
            const removedListItemRe = /^-\s*-\s*['"]?verified['"]?\s*$/;

            const flagged = [];
            for (const file of catalogFiles) {
              if (!/\.ya?ml$/.test(file.filename)) continue;
              // Catalog entries are small, so a patch is always present;
              // a missing one means no reviewable text diff — skip.
              const lines = (file.patch || '').split('\n');
              let editorial = false;
              for (let i = 0; i < lines.length; i++) {
                if (addedFeaturedRe.test(lines[i]) ||
                    removedFeaturedRe.test(lines[i]) ||
                    addedBadgesInlineRe.test(lines[i]) ||
                    removedBadgesInlineRe.test(lines[i]) ||
                    removedListItemRe.test(lines[i])) {
                  editorial = true;
                  break;
                }
                // Block-style list: an added `badges:` is only editorial when
                // list items are actually added under it.
                if (addedBadgesBlockRe.test(lines[i]) &&
                    lines.slice(i + 1).some(l => addedListItemRe.test(l))) {
                  editorial = true;
                  break;
                }
              }
              if (editorial) flagged.push(file.filename);
            }

            if (flagged.length === 0) {
              console.log('No editorial fields (featured/badges) changed — nothing to flag.');
              await clearStaleFlag();
              return;
            }

            // --- Is the author core team? ---------------------------------
            // Collaborator permission is the proxy for "core team": checking
            // org membership would need extra token scopes.
            const author = pr.user.login;
            let role = 'none';
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: author,
              });
              role = data.permission;
            } catch (error) {
              console.log(`Permission lookup for ${author} failed (${error.message}) — treating as non-maintainer.`);
            }
            if (maintainerRoles.includes(role)) {
              console.log(`Author "${author}" has ${role} access — editorial fields are theirs to grant.`);
              return;
            }

            console.log(`Editorial fields changed by non-maintainer "${author}" in: ${flagged.join(', ')}`);

            // --- Label ----------------------------------------------------
            // addLabels 422s on a label that doesn't exist in the repo, so
            // create it on first use. A label failure must not prevent the
            // sticky comment below — the comment is the primary signal.
            try {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: 'fbca04',
                  description: 'Editorial catalog fields changed by a non-maintainer',
                });
              }
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [label],
              });
            } catch (error) {
              console.log(`Applying label "${label}" failed (${error.message}) — continuing with the comment.`);
            }

            // --- Sticky comment: update in place so pushes don't spam -----
            const body = [
              marker,
              '### Editorial catalog fields detected',
              '',
              `This PR changes \`featured\` and/or \`badges\` on: ${flagged.map(f => `\`${f}\``).join(', ')}.`,
              '',
              'Those fields are granted by the Strands team, not set by submitters',
              '(see the [submission guide](https://strandsagents.com/docs/community/get-featured/)).',
              'Both granting and removing them needs maintainer confirmation — a',
              'maintainer should either **confirm the change** or **ask the',
              'submitter to revert it** before merging.',
              '',
              '_This is a heads-up for reviewers — it does not block merging._',
            ].join('\n');

            const existing = await findStickyComment();
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
