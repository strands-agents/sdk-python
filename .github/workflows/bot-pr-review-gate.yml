name: Bot PR Review Gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

# pull_request_target runs in the base-repo context. This job only reads PR
# metadata and reviews and sets the check status — it never checks out or
# executes PR head code, and needs no write scope.
permissions:
  contents: read
  pull-requests: read

jobs:
  check-bot-reviews:
    name: 2 Approvers for Bots
    runs-on: ubuntu-latest
    steps:
      - name: Enforce maintainer reviews for bot/agent PRs
        uses: actions/github-script@v9
        env:
          REQUIRED_APPROVALS: '2'
          MAINTAINER_ROLES: 'maintain,admin'
          # Trusted automation that is exempt from the 2-approver requirement.
          EXEMPT_AUTHORS: 'dependabot[bot]'
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.base.ref !== 'main') {
              console.log(`PR targets ${pr.base.ref}, not main — skipping.`);
              return;
            }

            const requiredApprovals = parseInt(process.env.REQUIRED_APPROVALS, 10);
            const maintainerRoles = process.env.MAINTAINER_ROLES
              .split(',').map(r => r.trim()).filter(Boolean);
            const exemptAuthors = (process.env.EXEMPT_AUTHORS || '')
              .split(',').map(a => a.trim().toLowerCase()).filter(Boolean);

            const author = pr.user.login;
            const authorType = pr.user.type;

            // Trusted automation (e.g. dependabot) is exempt — its PRs don't
            // require 2 maintainer approvals.
            if (exemptAuthors.includes(author.toLowerCase())) {
              console.log(`Author ${author} is exempt — skipping.`);
              return;
            }

            const botUsernamePatterns = [
              /\[bot\]$/,                       // reserved GitHub App suffix
              /^renovate(\[bot\])?$/i,
              /^github-actions(\[bot\])?$/i,
              /^snyk-bot$/i,
              /^codecov(\[bot\])?$/i,
              /^mergify(\[bot\])?$/i,
              /^greenkeeper(\[bot\])?$/i,
              // Agent accounts — intentionally broad so handles like
              // "kiro-agent" / "agent-of-x" are gated. This can also match a
              // human handle containing "agent"; that is an accepted tradeoff,
              // and such PRs can still merge with 2 maintainer approvals.
              /agent$/i,
              /-agent/i,
              /agent-/i,
              /'s[ -]agent/i,
            ];

            // Only the reserved `[bot]@` email shape. Broad noreply patterns are
            // excluded because `…@users.noreply.github.com` is the default
            // privacy email for *human* accounts.
            const botEmailPatterns = [/\[bot\]@/i];

            // Labels a maintainer can apply to opt a PR into the gate.
            const botLabels = new Set([
              'bot', 'dependencies', 'automated', 'auto-generated', 'agent',
            ]);

            const reasons = [];

            if (authorType === 'Bot') {
              reasons.push('user type is "Bot"');
            }
            if (botUsernamePatterns.some(p => p.test(author))) {
              reasons.push(`username "${author}" matches a bot/agent pattern`);
            }
            const prLabels = (pr.labels || []).map(l => l.name.toLowerCase());
            const matchedLabels = prLabels.filter(l => botLabels.has(l));
            if (matchedLabels.length > 0) {
              reasons.push(`PR has label(s): ${matchedLabels.join(', ')}`);
            }
            if (pr.performed_via_github_app) {
              reasons.push(`PR created via GitHub App "${pr.performed_via_github_app.name}"`);
            }

            // Inspect all commit author emails (paginated, not just first page).
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });
            const botEmails = commits
              .map(c => c.commit.author && c.commit.author.email)
              .filter(email => email && botEmailPatterns.some(p => p.test(email)));
            if (botEmails.length > 0) {
              reasons.push(`commit author email(s) match bot pattern: ${[...new Set(botEmails)].join(', ')}`);
            }

            const isBot = reasons.length > 0;
            console.log(`PR author: ${author}, type: ${authorType}, isBot: ${isBot}`);
            if (!isBot) {
              console.log('PR is not from a bot/agent — no additional review requirement.');
              return;
            }
            console.log(`Detection reasons:\n  - ${reasons.join('\n  - ')}`);

            // Count maintainer approvals. Only the latest review per user counts.
            // COMMENTED reviews are ignored: per GitHub merge semantics a later
            // comment does not revoke an existing APPROVED state.
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });
            const latestReviewByUser = new Map();
            for (const review of reviews) {
              if (!review.user) continue;
              if (review.state === 'COMMENTED') continue;
              latestReviewByUser.set(review.user.login, review.state);
            }

            async function isMaintainer(username) {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username,
                });
                return maintainerRoles.includes(data.role_name);
              } catch (error) {
                console.log(`Failed to check permission for ${username}: ${error.message}`);
                return false;
              }
            }

            const approvedBy = [];
            for (const [login, state] of latestReviewByUser.entries()) {
              if (state !== 'APPROVED') continue;
              if (await isMaintainer(login)) approvedBy.push(login);
            }

            console.log(`Maintainer approvals: ${approvedBy.length}/${requiredApprovals}`);
            console.log(`Approved by: ${approvedBy.join(', ') || 'none'}`);

            if (approvedBy.length < requiredApprovals) {
              core.setFailed(
                `Bot/agent PRs require at least ${requiredApprovals} maintainer approvals before merging. ` +
                `Currently have ${approvedBy.length}/${requiredApprovals}. ` +
                `Maintainers are repository collaborators with role: ${maintainerRoles.join(' or ')}.`
              );
            }
