name: Bot PR Review Gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed, edited]

# pull_request_target runs in the base-repo context with a write-capable token.
# This job only reads PR metadata, counts reviews, and (optionally) posts a
# status comment — it never checks out or executes PR head code.
permissions:
  contents: read
  pull-requests: write

jobs:
  check-bot-reviews:
    name: Bot/Agent PR Review Requirement
    runs-on: ubuntu-latest
    steps:
      # Check out the trusted BASE commit (not PR head) so the gate logic that
      # runs is always the version on the target branch.
      - name: Checkout base
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Enforce maintainer reviews for bot/agent PRs
        uses: actions/github-script@v9
        env:
          REQUIRED_APPROVALS: '2'
          MAINTAINER_ROLES: 'maintain,admin'
          BASE_BRANCH: 'main'
          POST_COMMENT: 'true'
        with:
          script: |
            const gate = require('./.github/scripts/bot-pr-review-gate.cjs');
            await gate({ github, context, core });
