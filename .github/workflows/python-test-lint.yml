name: "Python: Test and Lint"

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  unit-test:
    name: Unit Tests - Python ${{ matrix.python-version }} - ${{ matrix.os-name }}
    permissions:
      contents: read
    strategy:
      matrix:
       include:
        # Linux
        - os: ubuntu-latest
          os-name: 'linux'
          python-version: "3.10"
        - os: ubuntu-latest
          os-name: 'linux'
          python-version: "3.11"
        - os: ubuntu-latest
          os-name: 'linux'
          python-version: "3.12"
        - os: ubuntu-latest
          os-name: 'linux'
          python-version: "3.13"
        - os: ubuntu-latest
          os-name: 'linux'
          python-version: "3.14"
        # Windows
        - os: windows-latest
          os-name: 'windows'
          python-version: "3.10"
        - os: windows-latest
          os-name: 'windows'
          python-version: "3.11"
        - os: windows-latest
          os-name: 'windows'
          python-version: "3.12"
        - os: windows-latest
          os-name: 'windows'
          python-version: "3.13"
        - os: windows-latest
          os-name: 'windows'
          python-version: "3.14"
        # MacOS - latest only; not enough runners for macOS
        - os: macos-latest
          os-name: 'macOS'
          python-version: "3.14"
      fail-fast: true
    runs-on: ${{ matrix.os }}
    # Successful unit-test legs run in ~3-4 min (slowest observed ~16 min);
    # 25 min caps a hung step instead of letting it run to the 6-hour default.
    timeout-minutes: 25
    env:
      LOG_LEVEL: DEBUG
    defaults:
      run:
        working-directory: strands-py
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --no-cache-dir hatch
      - name: Run Unit tests
        id: tests
        # Retry failing tests so a flaky test doesn't block a release; a
        # genuinely broken test still fails after the reruns and holds the gate.
        run: hatch test tests --cover --reruns 2 --reruns-delay 5
        continue-on-error: false

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  unit-test-mcp-v2:
    name: MCP 2.x Compat
    # The dependency pin is `mcp<2`, so the unit-test matrix only ever
    # exercises the 1.x line and the 2.x branches of `_compat` run against
    # mocks there. This job force-installs the 2.x line over the pin to verify
    # against the real package that `import strands` succeeds and the compat
    # layer resolves the 2.x names. Scoped to the compat tests; the full suite
    # is not expected to pass on 2.x while the pin holds. Pinned to `2.0.*` so
    # upstream 2.x releases cannot break unrelated PRs; bump deliberately.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: strands-py
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'

      - name: Install package, then force mcp 2.x over the pin
        run: |
          pip install --no-cache-dir -e . \
            "pytest>=9.0.0,<10.0.0" \
            "pytest-asyncio>=1.0.0,<1.5.0" \
            "pytest-timeout>=2.0.0,<3.0.0" \
            "pytest-cov>=6.0.0,<8.0.0" \
            "moto>=5.1.0,<6.0.0"
          pip install --no-cache-dir "mcp==2.0.*"

      - name: Verify import and version flag
        run: python -c "import strands; from strands.tools.mcp import _compat; assert _compat.MCP_V2"

      # With coverage: the 2.x branches of `_compat` execute only in this job,
      # so without this upload they always show as uncovered on the patch.
      - name: Run compat tests
        run: pytest tests/strands/tools/mcp/test__compat.py -vv --cov=src/strands --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Lint typically runs in ~2 min; 20 min caps a hung step instead of
    # letting it run to the 6-hour default.
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: strands-py
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir hatch

      - name: Run lint
        id: lint
        run: hatch fmt --linter --check
        continue-on-error: false
